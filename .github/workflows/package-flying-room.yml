name: Package flyingRoom for SCF
on:
  push:
    branches:
      - standalone/flying-chess-minigame
    paths:
      - 'cloudfunctions/flyingRoom/**'
      - '.github/workflows/package-flying-room.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Node.js entry point
        run: |
          test -f cloudfunctions/flyingRoom/index.js
          test -f cloudfunctions/flyingRoom/package.json
          node --check cloudfunctions/flyingRoom/index.js
          node --check cloudfunctions/flyingRoom/service.js
      - name: Build ZIP with root-level index.js
        run: |
          cd cloudfunctions/flyingRoom
          zip -q -r "$GITHUB_WORKSPACE/flyingRoom.zip" index.js service.js package.json lib/
          cd "$GITHUB_WORKSPACE"
          unzip -t flyingRoom.zip
          unzip -Z -1 flyingRoom.zip | tee /tmp/flying-files.txt
          grep -Fxq 'index.js' /tmp/flying-files.txt
          grep -Fxq 'service.js' /tmp/flying-files.txt
          grep -Fxq 'package.json' /tmp/flying-files.txt
          ! grep -q '^cloudfunctions/' /tmp/flying-files.txt
          ! grep -q '^flyingRoom/' /tmp/flying-files.txt
      # upload-artifact always wraps its input in a download ZIP.
      # Uploading an already zipped flyingRoom.zip produces a *nested* ZIP:
      # GitHub artifact.zip -> flyingRoom.zip -> index.js, which CloudBase
      # cannot deploy directly ("filename not matched: index.js").
      # Upload source files as artifact contents so the *downloaded ZIP itself*
      # has root-level index.js / package.json and can go straight to Tencent.
      - name: Upload DIRECT deployment ZIP (index.js at ZIP root)
        uses: actions/upload-artifact@v4
        with:
          name: flyingRoom-DIRECT-upload
          path: cloudfunctions/flyingRoom/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flyingRoom-scf-zip
          path: flyingRoom.zip
          if-no-files-found: error
          retention-days: 14
