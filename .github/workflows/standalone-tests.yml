name: Standalone flying chess tests
on:
  push:
    branches:
      - standalone/flying-chess-wechat
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check self-contained app
        run: node --test tests/*.test.js
